name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install mcp-publisher
        run: |
          go install github.com/modelcontextprotocol/registry/cmd/publisher@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Authenticate via GitHub Actions OIDC
        run: mcp-publisher login github-oidc

      - name: Validate server.json against registry schema
        run: mcp-publisher validate

      - name: Publish to registry.modelcontextprotocol.io
        run: mcp-publisher publish
