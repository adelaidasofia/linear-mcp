name: Publish to MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true

      - name: Install mcp-publisher
        run: |
          go install github.com/modelcontextprotocol/registry/cmd/publisher@latest
          ln -sf "$HOME/go/bin/publisher" "$HOME/go/bin/mcp-publisher"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/mcp-publisher" --help | head -5

      - name: Authenticate via GitHub Actions OIDC
        run: mcp-publisher login github-oidc

      - name: Validate server.json against registry schema
        run: mcp-publisher validate

      - name: Publish to registry.modelcontextprotocol.io
        run: mcp-publisher publish
